<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <h2 class="logo">ShopEase</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to ShopEase</h1>
        <p>Your one-stop shop for everything!</p>
        <button onclick="login()">Login</button>
    </section>

    <!-- Product Section -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-container">
            <div class="card">
                <h3>Product 1</h3>
                <p>$25</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <h3>Product 2</h3>
                <p>$40</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <h3>Product 3</h3>
                <p>$60</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
